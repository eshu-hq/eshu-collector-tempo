# CI gates for eshu-collector-tempo.
#
# Thin caller over the shared lane bodies in
# eshu-hq/.github/.github/workflows/go-collector-ci.yml (v2, pinned below):
# this file holds the paths-filter `changes` job, the `go-ci` call with
# this repo's run-gate wiring, and the two caller-side jobs the reusable
# cannot own (weekly findings issue, SARIF upload). Lane bodies
# (lint/test/race/shell/image/boundary/govulncheck/gosec/actionlint and
# the ci-complete aggregator) live upstream; check runs nest as
# `go-ci / <lane>`, so the ruleset requires `go-ci / ci-complete`.
#
# Pinned actions (re-verify with git ls-remote when auditing; Dependabot
# github-actions proposes bumps, weekly grouped):
#   actions/checkout v7.0.1              3d3c42e5aac5ba805825da76410c181273ba90b1
#   dorny/paths-filter v4                ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
#   actions/download-artifact v7         37930b1c2abaa49bbe596cd826c3c89aef350131
#   github/codeql-action/upload-sarif v4.39.1 9b3254085494b55a0f7c4c2b3d2d52cc712ce370
#   eshu-hq/.github v2                   4d01ab90baf5dd77c21cc1ee6bdf701332613449
# Go tools (passed as inputs; hash-verified by the toolchain on install):
#   golangci-lint v2.12.2, govulncheck v1.9.0 (-scan package),
#   gosec v2.30.0 (this repo's measured 1-advisory baseline),
#   actionlint v1.7.12 (tarball, sha256-checked upstream).

name: ci

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC: govulncheck + gosec only
  workflow_dispatch: # manual runs execute every lane, like a push

permissions:
  contents: read

# Cancel superseded runs per PR (or per ref for pushes and schedules).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Runs on every event on purpose: on push the filter outputs are unused
    # (lane conditions short-circuit on event), but every lane `needs` this
    # job — skipping it on push drags all lanes to skipped and the push run
    # goes vacantly green (observed on post-merge main run 40611978095).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      fixtures: ${{ steps.filter.outputs.fixtures }}
      shell: ${{ steps.filter.outputs.shell }}
      deps: ${{ steps.filter.outputs.deps }}
      image: ${{ steps.filter.outputs.image }}
      workflows: ${{ steps.filter.outputs.workflows }}
      misc: ${{ steps.filter.outputs.misc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          # Needed so the `misc` catch-all below can use `!` negations;
          # groups without negations behave exactly as before.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
            fixtures:
              # Every entry is grep-proven test- or embed-consumed:
              # tempo/testdata/** via tempo/extraction_prep_golden_test.go:174
              # (os.ReadFile testdata/8867-parity-tempo.json),
              # **/*.json via the same parity fixture,
              # config.example.yaml via config_example_test.go:21
              # (os.ReadFile config.example.yaml),
              # manifest.yaml via manifest_embed.go:12
              # (go:embed manifest.yaml) plus manifest_test.go:36
              # (os.ReadFile manifest.yaml).
              - 'testdata/**'
              - '**/testdata/**'
              - '**/*.json'
              - 'manifest.yaml'
              - 'config.example.yaml'
            shell:
              - '**/*.sh'
            deps:
              - 'go.mod'
              - 'go.sum'
            image:
              # manifest.yaml is go:embed'ed into the binary
              # (manifest_embed.go:12), so a manifest change rebuilds
              # the image.
              - 'Dockerfile'
              - '.dockerignore'
              - 'manifest.yaml'
            workflows:
              - '.github/workflows/**'
            misc:
              # Default required by the epic: anything not classified above
              # runs the full Go lanes. Docs-only must keep skipping, so the
              # docs skip set stays negated here; every classified pattern is
              # negated too so narrow lanes (fixtures/shell/image) keep their
              # shape. Proven by the docs-only / fixture-only skip proofs.
              - '**'
              - '!**/*.md'
              - '!LICENSE'
              - '!CODEOWNERS'
              - '!**/*.go'
              - '!go.mod'
              - '!go.sum'
              - '!.golangci.yml'
              - '!testdata/**'
              - '!**/testdata/**'
              - '!**/*.json'
              - '!manifest.yaml'
              - '!config.example.yaml'
              - '!**/*.sh'
              - '!Dockerfile'
              - '!.dockerignore'
              - '!.github/workflows/**'

  go-ci:
    needs: [changes]
    # No timeout-minutes here: a reusable-call job accepts only name/uses/
    # with/secrets/needs/if/permissions (actionlint syntax-check rejects
    # the file otherwise), so the run ceiling lives in the upstream
    # inner-lane timeouts (lint/race/image 15, test/boundary/govulncheck
    # 10, gosec 30).
    uses: eshu-hq/.github/.github/workflows/go-collector-ci.yml@4d01ab90baf5dd77c21cc1ee6bdf701332613449 # v2
    with:
      module: tempo
      go-version-file: go.mod
      coverage-floor: 90
      run-image: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.image == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true' }}
      image-tag: eshu-collector-tempo:ci
      image-context: .
      image-command: |
        set -euo pipefail
        seed="$RUNNER_TEMP/seed"
        mkdir -p "$seed" && chmod 777 "$seed"
        docker run --rm --network none -v "$seed:/component" eshu-collector-tempo:ci seed --dest /component
        test -x "$seed/collector"
        test -s "$seed/manifest.yaml"
        total=$(grep -Ec '^[[:space:]]*image:' manifest.yaml)
        pinned=$(grep -Ec '^[[:space:]]*image:[[:space:]]*[^[:space:]#]+@sha256:[0-9a-f]{64}[[:space:]]*$' manifest.yaml)
        echo "manifest image refs: $pinned/$total digest-pinned"
        [ "$pinned" -ge 1 ] && [ "$pinned" -eq "$total" ]
        from_total=$(grep -Ec '^[[:space:]]*FROM ' Dockerfile)
        from_pinned=$(grep -Ec '^[[:space:]]*FROM [^[:space:]]+@sha256:[0-9a-f]{64}' Dockerfile)
        echo "Dockerfile bases: $from_pinned/$from_total digest-pinned"
        [ "$from_pinned" -eq "$from_total" ]
      run-lint: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true' }}
      run-test: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.fixtures == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true' }}
      run-race: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true' }}
      run-shell: ${{ github.event_name != 'pull_request' || needs.changes.outputs.shell == 'true' }}
      run-boundary: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true' }}
      boundary-command: go test -count=1 -run TestImportBoundaryRejectsCoreAndCrossCollectorImports .
      run-govulncheck: ${{ github.event_name != 'pull_request' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflows == 'true' }}
      run-gosec: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true' }}
      # Findings fail scheduled runs so the failure()-gated issue job
      # below is reachable; PR runs stay advisory green.
      gosec-fail-on-findings: ${{ github.event_name == 'schedule' }}
      gosec-version: v2.30.0 # this repo's measured 1-advisory baseline
      run-actionlint: ${{ github.event_name != 'pull_request' || needs.changes.outputs.workflows == 'true' }}

  scheduled-findings:
    # The reusable runs contents:read-only, so weekly issue filing stays a
    # caller job. One combined govulncheck+gosec issue (the reusable cannot
    # report per-lane results to the caller): fires only when go-ci failed
    # on a schedule event, and lists-or-comments instead of duplicating.
    needs: [go-ci]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: file or update the weekly findings issue
        run: |
          title="[ci] weekly scan findings $(date -u +%F)"
          body="Scheduled govulncheck/gosec failed on ${{ github.sha }}. See run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          open=$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number')
          if [ -n "$open" ] && [ "$open" != "null" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  gosec-sarif:
    # Security-tab upload the reusable deliberately omits (fork PRs run
    # read-only): caller-side, non-PR events only, and continue-on-error
    # so a 403 never turns into a silent green no-op. Skips when go-ci
    # failed (including scheduled-finding runs): the finding count stays
    # in that run's summary and the weekly issue links the run.
    needs: [go-ci]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: gosec-tempo
          path: ${{ github.workspace }}
      - name: upload SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: gosec.sarif
        continue-on-error: true
