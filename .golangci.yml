# Shared org golangci-lint config for collector repos + SDK modules.
# Pinned to golangci-lint v2.12.2 (same binary Eshu uses).
# Org lint set only: govet, staticcheck (which subsumes gosimple in v2),
# ineffassign, unused, errcheck; formatter gofumpt. No baselines,
# no new-from-rev.
#
# max-issues-per-linter: 0 and max-same-issues: 0 disable result
# truncation: the defaults (50/3) hid findings behind the first few, so the
# scan could undercount the backlog. Uncapped output keeps the gate honest.
version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - ineffassign
    - unused
    - errcheck

  # Reason: org-standard presets, byte-identical across the collector repos
  # (decision record: eshu-hq/eshu-collector-vulnerability-intelligence#14;
  # local tracking: #27). They silence only golangci's documented
  # std-error-handling and common-false-positives noise. The lint lane
  # proves zero findings outside these two documented classes; re-validate
  # the classes themselves by running golangci-lint with presets disabled.
  # Keep the presets byte-identical; do not diverge per-repo.
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    rules: []

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      extra-rules: false

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
